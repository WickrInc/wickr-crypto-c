name: MacOS
on: [push, pull_request]
env:
  BUILD_TYPE: Release
jobs:
  Build:
    runs-on: macos-15
    strategy:
      matrix:
        fips: [ON, OFF]
        arch: [x86_64, arm64]
        secure_memory: ['OFF']
        include:
          - fips: ON
            arch: arm64
            secure_memory: 'ON'
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: '>=1.17.0'
          cache: false
      - name: Setup Ninja
        run: brew install ninja
      - if: matrix.secure_memory == 'ON'
        name: Setup libsodium
        run: brew install libsodium
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build \
          -DBUILD_TESTS=true \
          -DFIPS=${{matrix.fips}} \
          -DWICKR_SECURE_MEMORY=${{matrix.secure_memory}} \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_OSX_ARCHITECTURES=${{matrix.arch}} \
          -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install
      - name: Build
        working-directory: ${{github.workspace}}/build
        run: make
      - if: matrix.arch == 'arm64'
        name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest --output-on-failure
      - name: Install
        working-directory: ${{github.workspace}}/build
        run: make install
