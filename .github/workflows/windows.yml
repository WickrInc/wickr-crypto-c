name: Windows
on: [push, pull_request]
env:
  BUILD_TYPE: Release
jobs:
  Build:
    runs-on: windows-latest
    strategy:
      matrix:
        fips: [ON, OFF]
        secure_memory: ['OFF']
        include:
          - fips: ON
            secure_memory: 'ON'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Dependencies
        shell: bash
        run: choco install cmake ninja nasm -y
      - if: matrix.secure_memory == 'ON'
        name: Setup libsodium
        shell: bash
        run: vcpkg install libsodium:x64-windows-static-md
      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build
      - name: Configure CMake
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          cmake \
          -DBUILD_TESTS=true \
          -DFIPS=${{matrix.fips}} \
          -DWICKR_SECURE_MEMORY=${{matrix.secure_memory}} \
          -DSODIUM_STATIC=ON \
          -DCMAKE_PREFIX_PATH="${VCPKG_INSTALLATION_ROOT//\\//}/installed/x64-windows-static-md" \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_GENERATOR_PLATFORM=x64 \
          ..
      - name: Build
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: cmake --build . --config ${{env.BUILD_TYPE}}
      - name: Test
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: ctest --output-on-failure
      - name: Install
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: cmake --install .
